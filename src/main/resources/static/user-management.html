<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>User Management - EduAssess Pro</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex">

<!-- SideNavBar -->
<aside class="fixed h-full left-0 top-0 w-64 flex flex-col bg-white border-r border-slate-200 z-50">
    <div class="flex flex-col h-full p-4 space-y-2">
        <div class="mb-8 px-2 mt-4">
            <span class="text-2xl font-black text-slate-900">EduAssess Pro</span>
        </div>
        
        <!-- Profile Section -->
        <div class="flex items-center space-x-3 px-2 mb-6">
            <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 font-bold border border-blue-200">
                AD
            </div>
            <div class="flex flex-col">
                <span id="admin-name" class="text-sm font-bold text-gray-900">Administrator</span>
                <span class="text-xs text-gray-500">Central Command</span>
            </div>
        </div>
        
        <!-- Main Nav Items -->
        <nav class="space-y-1 flex-grow">
            <a class="flex items-center space-x-3 px-4 py-3 text-slate-700 hover:bg-slate-100 rounded-lg transition-all" href="/admin-dashboard.html">
                <span class="material-symbols-outlined">dashboard</span>
                <span class="text-sm font-semibold">Dashboard</span>
            </a>
            <a class="flex items-center space-x-3 px-4 py-3 bg-blue-600 text-white rounded-lg font-bold shadow-sm transition-all scale-95 duration-75" href="/user-management.html">
                <span class="material-symbols-outlined">group</span>
                <span class="text-sm">User Management</span>
            </a>
            <a class="flex items-center space-x-3 px-4 py-3 text-slate-700 hover:bg-slate-100 rounded-lg transition-all" href="/notification-management.html">
                <span class="material-symbols-outlined">campaign</span>
                <span class="text-sm font-semibold">Notifications</span>
            </a>
        </nav>
        
        <!-- Footer Nav -->
        <div class="pt-4 border-t border-slate-200 space-y-1">
            <a class="flex items-center space-x-3 px-4 py-3 text-red-600 hover:bg-red-50 rounded-lg transition-all font-bold" href="#" onclick="logout()">
                <span class="material-symbols-outlined text-[20px]">logout</span>
                <span class="text-sm">Logout</span>
            </a>
        </div>
    </div>
</aside>

<!-- Main -->
<main class="ml-64 flex-1 p-10">

    <div class="flex justify-between items-center mb-8">
        <h1 class="text-4xl font-bold tracking-tight text-slate-900">User Management</h1>

        <input id="search-input"
               type="text"
               placeholder="Search users..."
               class="border border-slate-200 rounded-lg px-4 py-2 w-72 text-sm text-slate-700 shadow-sm focus:ring-2 focus:ring-blue-500 outline-none transition-shadow"
               onkeyup="filterTable()">
    </div>

    <!-- Tabs -->
    <div class="bg-white border border-slate-200 rounded-xl p-2 flex gap-2 mb-8 shadow-sm">

        <button id="btn-all"
                onclick="fetchUsers('/api/admin/all-users', 'btn-all')"
                class="tab-btn flex-1 py-2 rounded-lg bg-blue-600 text-white font-bold text-sm shadow-sm transition-colors">
            All Users
        </button>

        <button id="btn-pending"
                onclick="fetchUsers('/api/admin/pending-students', 'btn-pending')"
                class="tab-btn flex-1 py-2 rounded-lg hover:bg-slate-50 text-slate-700 font-semibold text-sm transition-colors">
            Pending Students
        </button>

        <button id="btn-never"
                onclick="fetchUsers('/api/admin/never-logged-in', 'btn-never')"
                class="tab-btn flex-1 py-2 rounded-lg hover:bg-slate-50 text-slate-700 font-semibold text-sm transition-colors">
            Never Logged In
        </button>

        <button onclick="openLecturerModal()"
                class="flex-1 py-2 rounded-lg hover:bg-slate-50 text-blue-600 border border-transparent hover:border-blue-200 font-bold text-sm transition-colors">
            Create Lecturer
        </button>
    </div>

    <!-- Table -->
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">

        <div class="p-6 border-b border-slate-200 bg-slate-50/50">
            <h2 class="text-xl font-semibold text-slate-800">Master User Directory</h2>
            <p id="table-subtitle" class="text-sm text-slate-500 mt-1">Showing users.</p>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full">

                <thead class="bg-slate-50 border-b border-slate-200">
                <tr>
                    <th class="px-6 py-4 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">ID</th>
                    <th class="px-6 py-4 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Name</th>
                    <th class="px-6 py-4 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Email</th>
                    <th class="px-6 py-4 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Role</th>
                    <th class="px-6 py-4 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Status</th>
                    <th class="px-6 py-4 text-right text-xs font-semibold text-slate-500 uppercase tracking-wider">Actions</th>
                </tr>
                </thead>

                <tbody id="user-table-body" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </div>
</main>

<!-- Lecturer Modal -->
<div id="lecturerModal"
     class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 transition-opacity">

    <div class="bg-white p-6 rounded-2xl w-[400px] shadow-2xl">

        <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2"><span class="material-symbols-outlined text-blue-600">person_add</span> Create Lecturer</h2>

        <div class="space-y-3">
            <input id="lecName" type="text" placeholder="Name" class="w-full border border-slate-200 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <input id="lecEmail" type="email" placeholder="Email" class="w-full border border-slate-200 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <input id="lecPhone" type="text" placeholder="Phone" class="w-full border border-slate-200 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <input id="lecDept" type="text" placeholder="Department" class="w-full border border-slate-200 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <input id="lecQual" type="text" placeholder="Qualification" class="w-full border border-slate-200 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div class="flex justify-end gap-2 mt-6 border-t border-slate-100 pt-4">
            <button onclick="closeLecturerModal()"
                    class="px-5 py-2 text-sm font-bold text-slate-600 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors">
                Cancel
            </button>
            <button onclick="submitLecturer()"
                    class="px-5 py-2 text-sm font-bold text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors flex items-center gap-1">
                Save
            </button>
        </div>
    </div>
</div>

<script>

    const userStr = localStorage.getItem('user');

    if (!userStr) {
        window.location.href = '/index.html';
    }

    const loggedUser = JSON.parse(userStr);

    if (loggedUser.role !== 'ADMIN') {
        alert('Access denied');
        window.location.href = '/index.html';
    }


    document.getElementById('admin-name').textContent = loggedUser.name;


    function logout() {
        localStorage.removeItem('user');
        window.location.href = '/index.html';
    }


    let currentEndpoint = '/api/admin/all-users';


    async function fetchUsers(endpoint, btnId) {

        currentEndpoint = endpoint;

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('bg-blue-500', 'text-white', 'font-bold');
        });

        document.getElementById(btnId)
            .classList.add('bg-blue-500', 'text-white', 'font-bold');

        try {

            const response = await fetch(endpoint);

            if (!response.ok) {
                throw new Error('Failed to fetch users');
            }

            const users = await response.json();

            renderUsers(users);

            document.getElementById('table-subtitle').textContent =
                `Showing ${users.length} users.`;

        } catch(error) {
            console.error(error);
            alert('Error loading users');
        }
    }


    function renderUsers(users) {

    const tbody = document.getElementById('user-table-body');

    tbody.innerHTML = '';

    users.forEach(user => {

        // Supports BOTH user_id and id
        console.log(user);

        const uid =
            user.user_id ||
            user.id ||
            user.userId ||
            user.userid ||
            user.uid;

        const tr = document.createElement('tr');
        tr.className = 'border-b user-row';

        let actionButtons = '';

        if (user.status === 'PENDING') {

            actionButtons += `
                <button onclick="approveUser(${uid})"
                    class="bg-green-600 text-white px-4 py-1.5 text-xs font-bold rounded-lg mr-2 hover:bg-green-700 transition-colors shadow-sm">
                    Approve
                </button>
            `;

            actionButtons += `
                <button onclick="rejectUser(${uid})"
                    class="bg-white border border-red-500 text-red-600 px-4 py-1.5 text-xs font-bold rounded-lg hover:bg-red-50 transition-colors shadow-sm">
                    Reject
                </button>
            `;

        } else if (user.status === 'ACTIVE') {

            actionButtons += `
                <button onclick="deactivateUser(${uid})"
                    class="bg-amber-500 text-white px-4 py-1.5 text-xs font-bold rounded-lg mr-2 hover:bg-amber-600 transition-colors shadow-sm">
                    Deactivate
                </button>
            `;

            actionButtons += `
                <button onclick="deleteUser(${uid})"
                    class="bg-white border border-red-500 text-red-600 px-4 py-1.5 text-xs font-bold rounded-lg hover:bg-red-50 transition-colors shadow-sm">
                    Delete
                </button>
            `;

        } else {

            actionButtons += `
                <button onclick="reactivateUser(${uid})"
                    class="bg-blue-600 text-white px-4 py-1.5 text-xs font-bold rounded-lg mr-2 hover:bg-blue-700 transition-colors shadow-sm">
                    Reactivate
                </button>
            `;

            actionButtons += `
                <button onclick="deleteUser(${uid})"
                    class="bg-white border border-red-500 text-red-600 px-4 py-1.5 text-xs font-bold rounded-lg hover:bg-red-50 transition-colors shadow-sm">
                    Delete
                </button>
            `;
        }

        tr.innerHTML = `
            <td class="px-6 py-4 text-sm font-semibold text-slate-700">#EDU-${uid}</td>
            <td class="px-6 py-4 text-sm text-slate-700 font-medium user-name">${user.name}</td>
            <td class="px-6 py-4 text-sm text-slate-500">${user.email}</td>
            <td class="px-6 py-4 text-sm text-slate-700 font-semibold">${user.role}</td>
            <td class="px-6 py-4 text-sm font-bold ${user.status === 'ACTIVE' ? 'text-green-600' : user.status === 'PENDING' ? 'text-amber-600' : 'text-red-600'}">${user.status}</td>
            <td class="px-6 py-4 text-right">${actionButtons}</td>
        `;

        tbody.appendChild(tr);
    });
}


    function filterTable() {

        const query = document.getElementById('search-input')
            .value
            .toLowerCase();

        const rows = document.querySelectorAll('.user-row');

        rows.forEach(row => {

            const name = row.querySelector('.user-name')
                .textContent
                .toLowerCase();

            row.style.display = name.includes(query)
                ? ''
                : 'none';
        });
    }


    async function doAction(url, method, bodyObj) {

        const options = {
            method: method
        };

        if (bodyObj) {
            options.headers = {
                'Content-Type': 'application/json'
            };

            options.body = JSON.stringify(bodyObj);
        }

        try {

            const response = await fetch(url, options);

            if (!response.ok) {
                const text = await response.text();
                throw new Error(text);
            }

            const btnId = currentEndpoint.includes('pending')
                ? 'btn-pending'
                : currentEndpoint.includes('never')
                    ? 'btn-never'
                    : 'btn-all';

            fetchUsers(currentEndpoint, btnId);

        } catch(error) {
            console.error(error);
            alert(error.message);
        }
    }


    function approveUser(id) {

        if (confirm('Approve this student?')) {
            doAction('/api/admin/approve/' + id, 'PUT');
        }
    }


    function rejectUser(id) {

        const reason = prompt('Enter rejection reason:');

        if (reason) {
            doAction('/api/admin/reject/' + id, 'PUT', {
                reason: reason
            });
        }
    }


    function deactivateUser(id) {

        const reason = prompt('Enter deactivation reason:');

        if (reason) {
            doAction('/api/admin/deactivate/' + id, 'PUT', {
                reason: reason
            });
        }
    }


    function reactivateUser(id) {

        if (confirm('Reactivate this user?')) {
            doAction('/api/admin/reactivate/' + id, 'PUT');
        }
    }


    function deleteUser(id) {

        if (confirm('Delete this user?')) {
            doAction('/api/admin/delete-user/' + id, 'DELETE');
        }
    }


    function openLecturerModal() {
        document.getElementById('lecturerModal').classList.remove('hidden');
    }


    function closeLecturerModal() {
        document.getElementById('lecturerModal').classList.add('hidden');
    }


    async function submitLecturer() {

        const payload = {
            name: document.getElementById('lecName').value,
            email: document.getElementById('lecEmail').value,
            phone: document.getElementById('lecPhone').value,
            department: document.getElementById('lecDept').value,
            qualification: document.getElementById('lecQual').value
        };

        try {

            const response = await fetch('/api/admin/create-lecturer', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                throw new Error(await response.text());
            }

            alert('Lecturer created successfully');

            closeLecturerModal();

            fetchUsers('/api/admin/all-users', 'btn-all');

        } catch(error) {
            console.error(error);
            alert(error.message);
        }
    }


    window.addEventListener('DOMContentLoaded', () => {
        fetchUsers('/api/admin/all-users', 'btn-all');
    });

</script>

</body>
</html>
```
