<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Exam Terminal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0; padding: 20px;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .dashboard-container { display: flex; gap: 30px; width: 100%; max-width: 900px; }
        .main-panel {
            background: white; padding: 40px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); flex: 2; text-align: center;
        }
        .tracking-sidebar {
            background: white; padding: 30px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); flex: 1;
            display: flex; flex-direction: column; align-items: center;
        }
        h1 { color: #1a73e8; margin: 0 0 10px 0; }
        #timer { font-size: 54px; font-weight: bold; color: #d93025; margin: 20px 0; display: none; }
        .btn { padding: 12px 30px; font-size: 18px; cursor: pointer; border: none; border-radius: 8px; transition: 0.3s; margin: 10px; }
        .btn-start { background-color: #34a853; color: white; }
        .btn-submit { background-color: #1a73e8; color: white; display: none; }
        #status { font-weight: 600; margin-top: 20px; min-height: 24px; color: #5f6368; }
        #sessionInfo { display: none; margin-top: 20px; }

        /* Interactive Grid for marking answers */
        .grid-title { font-weight: bold; color: #1a73e8; margin-bottom: 15px; }
        .question-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; }
        .grid-item {
            padding: 15px 10px; background-color: #e8eaed; color: #5f6368;
            text-align: center; font-weight: bold; border-radius: 8px;
            cursor: pointer; transition: 0.3s; user-select: none;
        }
        .grid-item.attempted { background-color: #34a853; color: white; }
        .grid-item.active-q { border: 2px solid #1a73e8; background-color: #e8f0fe; }

        /* Answer Input Box area */
        .answer-workspace { margin: 20px 0; padding: 20px; background: #f8f9fa; border-radius: 8px; text-align: left; display: none; }
        .answer-workspace textarea { width: 100%; height: 80px; margin-top: 10px; resize: none; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="main-panel">
        <h1>Secure Exam Workspace</h1>
        <div id="status">Please authenticate and click Start to begin your session.</div>
        <div id="timer">30:00</div>

        <button id="startBtn" class="btn btn-start" onclick="startExam()">Start Examination</button>

        <div id="sessionInfo">
            <div class="answer-workspace" id="workspace">
                <span id="currentQuestionLabel">Select a question from the sidebar to record your answer status.</span>
                <textarea id="answerInput" placeholder="Type your answer text/code here..." oninput="saveCurrentAnswer()"></textarea>
            </div>
            <button class="btn btn-submit" id="submitBtn" onclick="submitExam()">Finish & Submit</button>
        </div>
    </div>

    <div class="tracking-sidebar">
        <div class="grid-title">Question Dashboard</div>
        <div class="question-grid">
            <div class="grid-item" id="q1" onclick="selectQuestion(1)">Q1</div>
            <div class="grid-item" id="q2" onclick="selectQuestion(2)">Q2</div>
            <div class="grid-item" id="q3" onclick="selectQuestion(3)">Q3</div>
        </div>
    </div>
</div>

<script>
    let examActive = false;
    let secondsLeft = 30 * 60;
    let attemptId = null;
    let selectedQuestion = null;

    // Student Answers Data Object Store
    let studentAnswers = { "1": "", "2": "", "3": "" };

    function startExam() {
        // 1. Student Exam Enrollment Request
        fetch('http://localhost:8080/api/exams/start?studentId=1&examId=101&duration=30', { method: 'POST' })
            .then(response => response.text())
            .then(message => {
                const matched = message.match(/Attempt ID: (\d+)/);
                if (matched) attemptId = matched[1];

                examActive = true;
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('timer').style.display = 'block';
                document.getElementById('sessionInfo').style.display = 'block';
                document.getElementById('workspace').style.display = 'block';
                document.getElementById('submitBtn').style.display = 'inline-block';

                document.getElementById('status').innerText = "MONITORING ACTIVE: Leaving this screen flags cheating.";
                document.getElementById('status').style.color = "#34a853";

                selectQuestion(1); // Auto-focus first slot
                runTimer();
            });
    }

    function selectQuestion(qNum) {
        if (!examActive) return;
        selectedQuestion = qNum;

        // Handle active UI classes
        document.querySelectorAll('.grid-item').forEach(el => el.classList.remove('active-q'));
        document.getElementById(`q${qNum}`).classList.add('active-q');

        document.getElementById('currentQuestionLabel').innerText = `Recording response data for Workspace Item #${qNum}:`;
        document.getElementById('answerInput').value = studentAnswers[qNum];
    }

    function saveCurrentAnswer() {
        if (!selectedQuestion) return;
        const value = document.getElementById('answerInput').value;
        studentAnswers[selectedQuestion] = value;

        // Mark grid cell green if it contains data
        const gridCell = document.getElementById(`q${selectedQuestion}`);
        if (value.trim().length > 0) {
            gridCell.classList.add('attempted');
        } else {
            gridCell.classList.remove('attempted');
        }
    }

    // 3. Timer Functionality (Client Countdown side)
    function runTimer() {
        const timerDisplay = document.getElementById('timer');
        const interval = setInterval(() => {
            if (!examActive || secondsLeft <= 0) {
                clearInterval(interval);
                if (secondsLeft <= 0) submitExam(); // Auto-submit when time expires
            } else {
                secondsLeft--;
                let mins = Math.floor(secondsLeft / 60);
                let secs = secondsLeft % 60;
                timerDisplay.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }
        }, 1000);
    }

    // 4. Submit Answers API Execution
    function submitExam() {
        examActive = false;

        // Send payload map containing responses along with the submission request
        fetch(`http://localhost:8080/api/exams/submit/${attemptId}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(studentAnswers)
        })
            .then(res => res.json())
            .then(data => {
                document.getElementById('sessionInfo').style.display = 'none';
                document.getElementById('timer').style.display = 'none';
                document.getElementById('status').innerText = `Submission Finalized: ${data.message}`;
                document.getElementById('status').style.color = "#1a73e8";
            });
    }

    // 5. Prevent Cheating Logic
    window.onblur = function() {
        if (examActive) {
            document.getElementById('status').innerText = "SECURITY ALERT: Window blur tracked! Violation logged.";
            document.getElementById('status').style.color = "#d93025";

            fetch(`http://localhost:8080/api/exams/report-cheat/${attemptId}`, { method: 'POST' });
        }
    };
</script>
</body>
</html>
